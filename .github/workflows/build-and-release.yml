name: Build & Release Swiftfin IPAs

on:
  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:
    inputs:
      target:
        description: 'Upstream Tag, Branch, or Commit SHA to build (leave empty for latest upstream release)'
        required: false
        type: string
        default: ''
      platform:
        description: 'Target platform(s)'
        required: true
        type: choice
        options:
          - all
          - ios
          - tvos
        default: 'all'
      force_rebuild:
        description: 'Force build & overwrite release even if it already exists'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark published release as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-upstream:
    name: Resolve Target & Check Existing
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve target and compare
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PLATFORM: ${{ inputs.platform || 'all' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          IS_PRERELEASE: ${{ inputs.is_prerelease || 'false' }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="jellyfin/Swiftfin"
          CURRENT_REPO="${GITHUB_REPOSITORY}"

          echo "🔍 Resolving build target for $UPSTREAM_REPO..."

          TARGET_REF=""
          TAG_NAME=""
          PRERELEASE="$IS_PRERELEASE"

          if [ -n "$INPUT_TARGET" ]; then
            TARGET_REF="$INPUT_TARGET"
            echo "Manual target requested: $TARGET_REF"

            if gh api "repos/$UPSTREAM_REPO/releases/tags/$TARGET_REF" >/dev/null 2>&1; then
              TAG_NAME="$TARGET_REF"
            elif gh api "repos/$UPSTREAM_REPO/git/ref/tags/$TARGET_REF" >/dev/null 2>&1; then
              TAG_NAME="$TARGET_REF"
            else
              SHORT_DATE=$(date +'%Y%m%d')
              TAG_NAME="nightly-${TARGET_REF}-${SHORT_DATE}"
              PRERELEASE="true"
              echo "Target is a branch/commit. Using release tag: $TAG_NAME"
            fi
          else
            LATEST_TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG=$(gh api "repos/$UPSTREAM_REPO/tags" --jq '.[0].name')
            fi
            TARGET_REF="$LATEST_TAG"
            TAG_NAME="$LATEST_TAG"
            echo "Latest upstream release tag: $TAG_NAME"
          fi

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "❌ Failed to resolve valid tag."
            exit 1
          fi

          EXISTS_IN_REPO="false"
          if gh release view "$TAG_NAME" --repo "$CURRENT_REPO" >/dev/null 2>&1; then
            EXISTS_IN_REPO="true"
          fi

          if [ "$EXISTS_IN_REPO" = "true" ] && [ "$FORCE_REBUILD" != "true" ]; then
            echo "✅ Release '$TAG_NAME' already exists in $CURRENT_REPO. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🚀 Target confirmed: Building $TARGET_REF as release $TAG_NAME"

          case "$INPUT_PLATFORM" in
            ios)
              MATRIX='[{"platform":"ios","scheme":"Swiftfin","destination":"generic/platform=iOS"}]'
              ;;
            tvos)
              MATRIX='[{"platform":"tvos","scheme":"Swiftfin tvOS","destination":"generic/platform=tvOS"}]'
              ;;
            all)
              MATRIX='[{"platform":"ios","scheme":"Swiftfin","destination":"generic/platform=iOS"},{"platform":"tvos","scheme":"Swiftfin tvOS","destination":"generic/platform=tvOS"}]'
              ;;
            *)
              echo "Invalid platform '$INPUT_PLATFORM'"
              exit 1
              ;;
          esac

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "git_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-ipa:
    name: Build Unsigned IPA (${{ matrix.platform }})
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NSUnbufferedIO: "YES"
      GIT_TERMINAL_PROMPT: "0"
      XCODE_VERSION: "26.6"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-upstream.outputs.matrix) }}
    steps:
      - name: Checkout Swiftfin (${{ needs.check-upstream.outputs.git_ref }})
        uses: actions/checkout@v4
        with:
          repository: jellyfin/Swiftfin
          ref: ${{ needs.check-upstream.outputs.git_ref }}
          submodules: recursive

      # ─── Ruby + Fastlane (mirrors official Swiftfin CI) ───
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select Xcode & Accept License
        run: |
          # Try exact match first, then fallback to latest available
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcodebuild -license accept
          xcodebuild -version

          # Skip macro/plugin trust prompts
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Install Homebrew Dependencies
        run: brew bundle --file Brewfile

      - name: Cache Carthage
        uses: actions/cache@v4
        with:
          path: Carthage
          key: ${{ runner.os }}-carthage-${{ hashFiles('**/Cartfile') }}
          restore-keys: ${{ runner.os }}-carthage-

      - name: Update Carthage (VLCKit)
        run: carthage update --use-xcframeworks --cache-builds

      # ─── Pre-resolve SPM to isolate network fetches with a dedicated timeout ───
      - name: Resolve SPM Dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "🔄 Pre-resolving Swift Package Manager dependencies..."
          xcodebuild -resolvePackageDependencies \
            -scheme "${{ matrix.scheme }}" \
            -project ./Swiftfin.xcodeproj \
            -disableAutomaticPackageResolution
          echo "✅ SPM dependencies resolved"

      # ─── Build via Fastlane (mirrors official Swiftfin CI) ───
      - name: Build via Fastlane
        uses: nick-fields/retry@v2
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: bundle exec fastlane buildLane scheme:"\"${{ matrix.scheme }}\"" xcodeVersion:${{ env.XCODE_VERSION }}

      # ─── Package .app from DerivedData into unsigned IPA ───
      - name: Package Unsigned IPA
        env:
          SCHEME: ${{ matrix.scheme }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          set -euo pipefail

          IPA_NAME="Swiftfin-${PLATFORM}-${TAG}-unsigned.ipa"

          echo "📦 Locating .app bundle..."

          # Fastlane buildLane uses xcodebuild build (skipArchive: true)
          # .app lands in DerivedData/Build/Products/Release-iphoneos/ or Release-appletvos/
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/Build/Products/Release-*/*.app" \
            -not -path "*/PlugIns/*" \
            -maxdepth 7 2>/dev/null | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "⚠️ Trying broader DerivedData search..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
              -name "Swiftfin*.app" -type d \
              -not -path "*/PlugIns/*" \
              -not -path "*Intermediates*" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Failed to find .app. DerivedData contents:"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          echo "Found: $APP_PATH"

          # Strip code signatures for clean unsigned IPA
          codesign --remove-signature "${APP_PATH}" 2>/dev/null || true
          find "${APP_PATH}" \( -name "*.dylib" -o -name "*.framework" \) -print0 | \
            while IFS= read -r -d '' f; do
              codesign --remove-signature "$f" 2>/dev/null || true
            done

          # Package into IPA
          PAYLOAD_DIR="build/Payload"
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/"

          cd build
          zip -q -r -y "../${IPA_NAME}" Payload
          cd ..

          ls -lh "${IPA_NAME}"
          echo "🎉 Done: ${IPA_NAME}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.platform }}
          path: Swiftfin-*.ipa
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [check-upstream, build-ipa]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all IPA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipa-*
          merge-multiple: true

      - name: Clone Exact Upstream Release Notes & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          GIT_REF: ${{ needs.check-upstream.outputs.git_ref }}
          IS_PRERELEASE: ${{ needs.check-upstream.outputs.prerelease }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="jellyfin/Swiftfin"

          echo "📥 Fetching 1:1 release notes from upstream $UPSTREAM_REPO for $GIT_REF..."
          UPSTREAM_RELEASE_DATA=$(gh api "repos/$UPSTREAM_REPO/releases/tags/$GIT_REF" 2>/dev/null || true)
          if [ -z "$UPSTREAM_RELEASE_DATA" ] && [ "$GIT_REF" != "$TAG" ]; then
            UPSTREAM_RELEASE_DATA=$(gh api "repos/$UPSTREAM_REPO/releases/tags/$TAG" 2>/dev/null || true)
          fi

          RELEASE_TITLE="$TAG"
          if [ -n "$UPSTREAM_RELEASE_DATA" ]; then
            FETCHED_TITLE=$(echo "$UPSTREAM_RELEASE_DATA" | jq -r '.name // empty')
            [ -n "$FETCHED_TITLE" ] && RELEASE_TITLE="$FETCHED_TITLE"
            echo "$UPSTREAM_RELEASE_DATA" | jq -r '.body // ""' > release_notes.md
          else
            touch release_notes.md
          fi

          echo "🚀 Publishing 1:1 Release '$TAG' with title '$RELEASE_TITLE'..."

          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true

          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          gh release create "$TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            "${EXTRA_FLAGS[@]}" \
            *.ipa
