name: Build & Release Swiftfin IPAs

on:
  schedule:
    # Automatically check upstream every 6 hours
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      target:
        description: 'Upstream Tag, Branch, or Commit SHA to build (leave empty for latest upstream release)'
        required: false
        type: string
        default: ''
      platform:
        description: 'Target platform(s)'
        required: true
        type: choice
        options:
          - all
          - ios
          - tvos
        default: 'all'
      force_rebuild:
        description: 'Force build & overwrite release even if it already exists'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark published release as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-upstream:
    name: Resolve Target & Check Existing
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
      release_title: ${{ steps.resolve.outputs.release_title }}
      release_body: ${{ steps.resolve.outputs.release_body }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve target and compare
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PLATFORM: ${{ inputs.platform || 'all' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          IS_PRERELEASE: ${{ inputs.is_prerelease || 'false' }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="jellyfin/Swiftfin"
          CURRENT_REPO="${GITHUB_REPOSITORY}"

          echo "🔍 Resolving build target for $UPSTREAM_REPO..."

          TARGET_REF=""
          TAG_NAME=""
          PRERELEASE="$IS_PRERELEASE"

          if [ -n "$INPUT_TARGET" ]; then
            TARGET_REF="$INPUT_TARGET"
            echo "Manual target requested: $TARGET_REF"

            # Check if TARGET_REF matches an upstream tag
            if gh api "repos/$UPSTREAM_REPO/releases/tags/$TARGET_REF" >/dev/null 2>&1; then
              TAG_NAME="$TARGET_REF"
            elif gh api "repos/$UPSTREAM_REPO/git/ref/tags/$TARGET_REF" >/dev/null 2>&1; then
              TAG_NAME="$TARGET_REF"
            else
              # It could be a branch (like 'main') or commit SHA
              SHORT_DATE=$(date +'%Y%m%d')
              TAG_NAME="nightly-${TARGET_REF}-${SHORT_DATE}"
              PRERELEASE="true"
              echo "Target is a branch/commit. Using release tag: $TAG_NAME"
            fi
          else
            # Automated mode: Query latest release or tag from upstream
            LATEST_TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG=$(gh api "repos/$UPSTREAM_REPO/tags" --jq '.[0].name')
            fi
            TARGET_REF="$LATEST_TAG"
            TAG_NAME="$LATEST_TAG"
            echo "Latest upstream release tag: $TAG_NAME"
          fi

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            echo "❌ Failed to resolve valid tag."
            exit 1
          fi

          # Check if this release already exists in current repo
          EXISTS_IN_REPO="false"
          if gh release view "$TAG_NAME" --repo "$CURRENT_REPO" >/dev/null 2>&1; then
            EXISTS_IN_REPO="true"
          fi

          if [ "$EXISTS_IN_REPO" = "true" ] && [ "$FORCE_REBUILD" != "true" ]; then
            echo "✅ Release '$TAG_NAME' already exists in $CURRENT_REPO. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🚀 Target confirmed: Building $TARGET_REF as release $TAG_NAME"

          # Fetch upstream release metadata if available
          RELEASE_TITLE="Swiftfin $TAG_NAME"
          RELEASE_BODY="Automated unsigned IPA build tracking upstream [$TARGET_REF](https://github.com/$UPSTREAM_REPO)."

          UPSTREAM_RELEASE_DATA=$(gh api "repos/$UPSTREAM_REPO/releases/tags/$TARGET_REF" 2>/dev/null || true)
          if [ -n "$UPSTREAM_RELEASE_DATA" ]; then
            UPSTREAM_NAME=$(echo "$UPSTREAM_RELEASE_DATA" | jq -r '.name // empty')
            UPSTREAM_BODY=$(echo "$UPSTREAM_RELEASE_DATA" | jq -r '.body // empty')
            [ -n "$UPSTREAM_NAME" ] && RELEASE_TITLE="$UPSTREAM_NAME"
            [ -n "$UPSTREAM_BODY" ] && RELEASE_BODY="$UPSTREAM_BODY"
          fi

          # Resolve build matrix
          case "$INPUT_PLATFORM" in
            ios)
              MATRIX='[{"platform":"ios","scheme":"Swiftfin","destination":"generic/platform=iOS"}]'
              ;;
            tvos)
              MATRIX='[{"platform":"tvos","scheme":"Swiftfin tvOS","destination":"generic/platform=tvOS"}]'
              ;;
            all)
              MATRIX='[{"platform":"ios","scheme":"Swiftfin","destination":"generic/platform=iOS"},{"platform":"tvos","scheme":"Swiftfin tvOS","destination":"generic/platform=tvOS"}]'
              ;;
            *)
              echo "Invalid platform '$INPUT_PLATFORM'"
              exit 1
              ;;
          esac

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "git_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          # Escape multi-line body for GITHUB_OUTPUT
          {
            echo "release_body<<EOF"
            echo "$RELEASE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-ipa:
    name: Build Unsigned IPA (${{ matrix.platform }})
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-upstream.outputs.matrix) }}
    steps:
      - name: Checkout Swiftfin (${{ needs.check-upstream.outputs.git_ref }})
        uses: actions/checkout@v4
        with:
          repository: jellyfin/Swiftfin
          ref: ${{ needs.check-upstream.outputs.git_ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
          key: ${{ runner.os }}-brew-${{ hashFiles('Brewfile') }}
          restore-keys: ${{ runner.os }}-brew-

      - name: Install Homebrew dependencies
        run: |
          brew bundle --file Brewfile || brew install carthage swiftgen swiftlint

      - name: Cache Carthage
        uses: actions/cache@v4
        with:
          path: |
            Carthage
            ~/Library/Caches/org.carthage.CarthageKit
          key: ${{ runner.os }}-carthage-${{ hashFiles('**/Cartfile.resolved', '**/Cartfile') }}
          restore-keys: ${{ runner.os }}-carthage-

      - name: Bootstrap Carthage Frameworks
        run: |
          carthage update --use-xcframeworks --cache-builds

      - name: Build Unsigned Archive & Package IPA
        env:
          SCHEME: ${{ matrix.scheme }}
          DESTINATION: ${{ matrix.destination }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="build/${SCHEME}.xcarchive"
          IPA_NAME="Swiftfin-${PLATFORM}-${TAG}-unsigned.ipa"
          PAYLOAD_DIR="build/payload_${PLATFORM}/Payload"

          mkdir -p build

          echo "⚙️ Archiving ${SCHEME} without code signing..."
          xcodebuild archive \
            -project Swiftfin.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "${DESTINATION}" \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -skipMacroValidation \
            -skipPackagePluginValidation

          echo "📦 Locating .app bundle..."
          APP_PATH=$(find "${ARCHIVE_PATH}/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Failed to find compiled .app bundle in ${ARCHIVE_PATH}/Products/Applications"
            exit 1
          fi

          echo "Packaging into unsigned IPA: ${IPA_NAME}..."
          mkdir -p "${PAYLOAD_DIR}"
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/"

          cd "build/payload_${PLATFORM}"
          zip -q -r -y "../../${IPA_NAME}" Payload
          cd ../..

          ls -lh "${IPA_NAME}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.platform }}
          path: Swiftfin-*.ipa
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [check-upstream, build-ipa]
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all IPA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipa-*
          merge-multiple: true

      - name: Generate Checksums & Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-upstream.outputs.tag }}
          TITLE: ${{ needs.check-upstream.outputs.release_title }}
          BODY: ${{ needs.check-upstream.outputs.release_body }}
          IS_PRERELEASE: ${{ needs.check-upstream.outputs.prerelease }}
        run: |
          set -euo pipefail

          echo "🔐 Computing SHA256 checksums..."
          sha256sum *.ipa > sha256sums.txt
          cat sha256sums.txt

          NOTES=$(cat << 'EOF'
### 📱 Swiftfin Unsigned IPAs

Unsigned `.ipa` binaries built directly from [jellyfin/Swiftfin](https://github.com/jellyfin/Swiftfin).

#### 📥 Sideloading
Sign or install with any sideloading tool:
- **iOS**: TrollStore, SideStore, AltStore, Sideloadly, Feather, LiveContainer
- **tvOS**: Sideloadly, Apple Configurator, TrollStore (tvOS 15-17.0)

#### 🔒 SHA256 Checksums
```
$(cat sha256sums.txt)
```

---
### Upstream Release Notes
${BODY}
EOF
)
          FORMATTED_NOTES=$(echo "$NOTES" | sed "s|\${BODY}|$BODY|g")

          echo "🚀 Creating GitHub Release $TAG..."
          
          # Delete existing release if force rebuild was requested
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          
          EXTRA_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=("--prerelease")
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$FORMATTED_NOTES" \
            "${EXTRA_FLAGS[@]}" \
            *.ipa \
            sha256sums.txt
